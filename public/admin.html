<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Admin - Confirmações</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;800&family=Nunito+Sans:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body class="admin-body">
  <div class="balloons" aria-hidden="true">
    <span class="balloon b1"></span>
    <span class="balloon b2"></span>
    <span class="balloon b3"></span>
    <span class="balloon b4"></span>
    <span class="balloon b5"></span>
    <span class="balloon b6"></span>
  </div>

  <main class="card" id="loginCard">
    <div class="card-head">
      <div class="login-avatar">
        <svg viewBox="0 0 24 24" width="38" height="38" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
          <circle cx="12" cy="16" r="1.4" />
        </svg>
      </div>
      <h1>Acesso Restrito</h1>
      <p class="party-message">Entre com o usuário criado no Supabase para ver as confirmações.</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="adminEmail">E-mail</label>
        <input
          type="email"
          id="adminEmail"
          placeholder="seu@email.com"
          autocomplete="username"
          required
        />
        <span class="error-msg" data-for="adminEmail"></span>
      </div>
      <div class="field">
        <label for="adminPassword">Senha</label>
        <input
          type="password"
          id="adminPassword"
          placeholder="Sua senha"
          autocomplete="current-password"
          required
        />
        <span class="error-msg" data-for="adminPassword"></span>
      </div>
      <button type="submit" id="loginBtn" class="submit-btn">Entrar</button>
    </form>

    <div id="errorBox" class="error-box" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 3 2.5 20h19L12 3z" />
        <path d="M12 10v4M12 17h.01" />
      </svg>
      <p id="errorText"></p>
    </div>
  </main>

  <main class="card" id="panelCard" hidden>
    <div class="admin-card-head">
      <h1>Confirmações de presença</h1>
      <button type="button" class="btn btn-secondary" id="logoutBtn">Sair</button>
    </div>

    <div class="stats">
      <div class="stat-box">
        <div class="stat-num" id="statTotal">0</div>
        <div class="stat-label">Confirmados</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="statToday">0</div>
        <div class="stat-label">Hoje</div>
      </div>
    </div>

    <div class="actions-bar">
      <button type="button" class="btn btn-primary" id="exportCsvBtn">Exportar CSV</button>
      <button type="button" class="btn btn-secondary" id="refreshBtn">Atualizar</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Nome</th>
            <th>E-mail</th>
            <th>Celular</th>
            <th>Confirmado em</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="responsesBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" hidden>
        Nenhuma confirmação até agora.
      </div>
    </div>
  </main>

  <div id="toast" class="toast" role="status"></div>

  <script src="config.js?v=4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
